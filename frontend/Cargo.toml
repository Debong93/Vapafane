[package]
name = "vapafane-ui"
version = "0.9.0"
description = "Vapafane-Oberfläche in Rust (Leptos, läuft als WebAssembly in Tauri)"
license = "MIT"
edition = "2024"
rust-version = "1.89"

[dependencies]
vapafane-shared = { path = "../shared" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
    "Document", "DomRect", "DomStringMap", "DomTokenList", "Element", "HtmlElement",
    "MediaQueryList", "MouseEvent", "Storage", "VisibilityState", "Window",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
