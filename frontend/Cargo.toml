[package]
name = "vapafane-ui"
version = "0.9.5"
description = "Bedienoberfläche von Vapafane (Leptos, läuft als WebAssembly im Tauri-Fenster)"
authors = ["Debong93"]
license = "MIT"
repository = "https://github.com/Debong93/Vapafane"
homepage = "https://github.com/Debong93/Vapafane"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
vapafane-shared = { path = "../shared" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
futures-channel = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration", "Document", "DomRect", "DomStringMap", "DomTokenList", "Element",
    "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "KeyboardEvent",
    "MediaQueryList", "MouseEvent", "Navigator", "ScrollIntoViewOptions", "ScrollLogicalPosition",
    "ScrollBehavior", "Storage", "VisibilityState", "Window",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
