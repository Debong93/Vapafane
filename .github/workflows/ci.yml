# Prüft bei jedem Push, ob alles baut und die Tests laufen – nur unter Linux, um
# Actions-Minuten zu sparen. Windows wird beim Release (release.yml) gebaut und getestet.
name: Prüfen

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]  # reine Text-Änderungen brauchen keinen Lauf
  pull_request:
    paths-ignore: ["**.md"]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Bibliotheken installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
