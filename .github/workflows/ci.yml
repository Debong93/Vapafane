# Prüft bei jedem Push, ob alles baut und die Tests laufen – nur unter Linux, um
# Actions-Minuten zu sparen. Windows wird beim Release (release.yml) gebaut und getestet.
name: Check

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]  # reine Text-Änderungen brauchen keinen Lauf
  pull_request:
    paths-ignore: ["**.md"]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./frontend -> target

      # Die Oberfläche (Rust/WebAssembly) muss vor dem Backend gebaut sein – Tauri bettet sie ein
      - name: Build the interface
        working-directory: frontend
        run: trunk build --release

      - name: Clippy (interface)
        working-directory: frontend
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

      - name: Tests (shared types and languages)
        working-directory: shared
        run: cargo test --locked

      - name: Tests (tools and language check)
        working-directory: werkzeuge
        run: cargo test --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
