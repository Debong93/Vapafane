# Baut bei einem Tag v* (z. B. v0.1.0) die Installer und legt einen Release an:
# Windows: .exe (NSIS) und .msi – Linux: AppImage und .deb
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Bibliotheken installieren
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Tauri-Werkzeug installieren
        run: cargo install tauri-cli --version "^2" --locked

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: "Vapafane ${{ github.ref_name }}"
          releaseBody: |
            Vapafane – eigener Minecraft-Server und Freunde einladen, ganz ohne Befehle.

            **Windows:** `Vapafane_…_x64-setup.exe` herunterladen und starten. Bei „Der Computer wurde durch Windows geschützt“ → „Weitere Informationen“ → „Trotzdem ausführen“.

            **Linux:** `.deb` herunterladen und `sudo apt install ./Vapafane_…_amd64.deb` – oder das `.AppImage` ausführbar machen und starten.

            Für einen eigenen Server wird Java gebraucht (Minecraft 26.x: Java 25).

            Kein offizielles Minecraft-Produkt. Nicht von Mojang oder Microsoft genehmigt und nicht mit ihnen verbunden.
            Kontakt: https://github.com/Debong93/Vapafane/issues
          releaseDraft: false
          prerelease: false
