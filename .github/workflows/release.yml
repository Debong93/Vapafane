# Baut bei einem Tag v* (z. B. v0.9.5) die Installer und legt einen Release an:
# Windows: Setup (.exe, NSIS) – Linux: .deb
# (Solange keine Actions-Minuten frei sind, werden Releases lokal gebaut und mit gh hochgeladen.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: deb
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Bibliotheken installieren
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./frontend -> target

      - name: Oberfläche bauen
        working-directory: frontend
        run: trunk build --release

      - name: Tauri-Werkzeug installieren
        run: cargo install tauri-cli --version "^2" --locked

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: "Vapafane ${{ github.ref_name }}"
          releaseBody: |
            **What's new:** see the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
            **Was ist neu:** siehe [Änderungsprotokoll](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) (deutsche Anleitung: [README.de.md](https://github.com/${{ github.repository }}/blob/main/README.de.md)).

            | System | File / Datei |
            |---|---|
            | Windows 10/11 | `Vapafane_…_x64-setup.exe` – on "Windows protected your PC" → "More info" → "Run anyway" |
            | Linux (Ubuntu, Debian, Mint …) | `Vapafane_…_amd64.deb` – double-click or `sudo apt install ./Vapafane_…_amd64.deb` |

            Running your own server needs Java (Minecraft 26.x: Java 25); joining friends does not.
            Für einen eigenen Server wird Java gebraucht (Minecraft 26.x: Java 25), zum Mitspielen nicht.

            Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.
          releaseDraft: false
          prerelease: false
