name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: ["Fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Bitte keine Passwörter, Einladungs-Codes oder öffentlichen IP-Adressen hineinkopieren.
  - type: input
    id: version
    attributes:
      label: Vapafane-Version
      description: Steht in den Einstellungen unter „Über Vapafane“.
      placeholder: z. B. 0.9.5
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Betriebssystem
      options:
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: bereich
    attributes:
      label: Bereich
      options:
        - Server (eigenen Server betreiben)
        - Client (bei Freunden mitspielen)
        - Installation
        - Sonstiges
    validations:
      required: true
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, und was ist dann passiert? Gern mit Bildschirmfoto.
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Was hast du erwartet?
  - type: textarea
    id: meldung
    attributes:
      label: Fehlermeldung oder Protokoll
      description: Die Meldung aus Vapafane oder die letzten Zeilen der Konsole.
      render: text
