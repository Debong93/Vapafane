name: Idee oder Wunsch
description: Eine neue Funktion oder Verbesserung vorschlagen
labels: ["Wunsch"]
body:
  - type: textarea
    id: wunsch
    attributes:
      label: Was wünschst du dir?
      description: Beschreib kurz, was Vapafane können soll – und wobei es dir helfen würde.
    validations:
      required: true
  - type: dropdown
    id: bereich
    attributes:
      label: Bereich
      options:
        - Server
        - Client
        - Sonstiges
