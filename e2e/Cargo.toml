[package]
name = "vapafane-e2e"
version = "0.9.3"
description = "Oberflächen-Tests für Vapafane: bedient das echte Programm per WebDriver (tauri-driver)"
license = "MIT"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
fantoccini = { version = "0.22", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
