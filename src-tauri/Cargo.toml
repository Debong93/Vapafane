[package]
name = "vapafane"
version = "0.9.2"
description = "Vapafane-Programm: Tauri-Fenster, Hintergrund-Dienst für den Minecraft-Server und Befehlszeile"
authors = ["Debong93"]
license = "MIT"
edition = "2024"
rust-version = "1.89"

[lib]
name = "vapafane_lib"
# Nur Desktop: staticlib/cdylib bräuchte man nur für Android/iOS (und die DLL scheitert beim Windows-Querbau)
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
rand = "0.9"
hex = "0.4"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
ruzstd = "0.8"
ureq = { version = "3", features = ["json"] }
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
ctrlc = { version = "3", features = ["termination"] }
regex = "1"
walkdir = "2"
base64 = "0.22"
socket2 = "0.6"
notify-rust = "4"
vapafane-shared = { path = "../shared" }
bs58 = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
